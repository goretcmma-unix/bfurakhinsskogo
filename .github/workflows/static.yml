name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Supabase public config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          url = os.environ.get('SUPABASE_URL', '').strip()
          key = os.environ.get('SUPABASE_ANON_KEY', '').strip()
          if not url or not key:
            print('Missing SUPABASE_URL or SUPABASE_ANON_KEY GitHub Secrets', file=sys.stderr)
            sys.exit(1)
          p = Path('public-site/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('__SUPABASE_URL__', url)
          s = s.replace('__SUPABASE_ANON_KEY__', key)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public-site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

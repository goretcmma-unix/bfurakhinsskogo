name: Sync public data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Shared with sber-auto-sync.yml: both workflows push to master every 5 minutes.
  group: repository-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Sync public data snapshot
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/sync-public-data.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- public-site/data.json; then
            echo "No data.json changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-site/data.json
          git commit -m "chore: sync public-site data snapshot"
          for attempt in 1 2 3 4 5; do
            git fetch origin master
            if git rebase origin/master && git push origin HEAD:master; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed, retrying"
            sleep $((attempt * 5))
          done
          echo "WARNING: data.json was not pushed; next run will retry"
          exit 0

name: Sber auto-sync (once)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sber-auto-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Restore Sber runtime bundle
        env:
          SBER_DATA_B64: ${{ secrets.SBER_DATA_B64 }}
        run: |
          if [ -z "$SBER_DATA_B64" ]; then
            echo "SBER_DATA_B64 secret is not set"
            exit 1
          fi
          echo "$SBER_DATA_B64" | base64 -d > /tmp/sber-bundle.tar.gz
          tar -xzf /tmp/sber-bundle.tar.gz \
            --exclude='*.bak*' \
            --exclude='.sber-data/sber-secrets/tokens.json' \
            --exclude='.sber-data/sber-sync/state.json' \
            -C .
          test -d .sber-data
          test -f .env

      - name: Restore .env fallback
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ ! -f .env ] && [ -n "$ENV_FILE" ]; then
            printf '%s\n' "$ENV_FILE" > .env
          fi

      - name: Run sber-auto-sync (once)
        run: node scripts/sber-auto-sync.mjs --once

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Encrypted token pair and sync cursor must survive GitHub runners.
          git add -f .sber-data/sber-secrets/tokens.json .sber-data/sber-sync/state.json || true
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: sber auto-sync"
          git push origin HEAD:master
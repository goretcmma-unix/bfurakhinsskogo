name: Sber auto-sync (once)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  # External cron/worker can dispatch this every minute; GitHub's own
  # scheduler is heavily delayed and cannot provide near-real-time updates.
  repository_dispatch:
    types: [sber-sync]

permissions:
  contents: write

concurrency:
  # Shared with sync-data.yml: both workflows push to master every 5 minutes.
  group: repository-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Restore Sber runtime bundle
        env:
          SBER_DATA_B64: ${{ secrets.SBER_DATA_B64 }}
        run: |
          if [ -z "$SBER_DATA_B64" ]; then
            echo "SBER_DATA_B64 secret is not set"
            exit 1
          fi
          echo "$SBER_DATA_B64" | base64 -d > /tmp/sber-bundle.tar.gz
          tar -xzf /tmp/sber-bundle.tar.gz --exclude='*.bak*' -C .
          # Once tokens/cursor are committed by a previous run, prefer those over the bundle.
          git checkout HEAD -- .sber-data/sber-secrets/tokens.json .sber-data/sber-sync/state.json 2>/dev/null || true
          test -d .sber-data
          test -f .env

      - name: Restore .env fallback
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ ! -f .env ] && [ -n "$ENV_FILE" ]; then
            printf '%s\n' "$ENV_FILE" > .env
          fi

      - name: Run sber-auto-sync (once)
        run: npm run sber:sync-once

      # Immediately publish newly imported rows; otherwise the separate
      # sync-data.yml job would add up to another 5 minutes of delay.
      - name: Refresh public data snapshot
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/sync-public-data.mjs

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Encrypted token pair and sync cursor must survive GitHub runners.
          git add -f .sber-data/sber-secrets/tokens.json .sber-data/sber-sync/state.json || true
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: sber auto-sync"
          for attempt in 1 2 3 4 5; do
            git fetch origin master
            if git rebase origin/master && git push origin HEAD:master; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed, retrying"
            sleep $((attempt * 5))
          done
          echo "WARNING: changes were not pushed; next run will retry"
          exit 0
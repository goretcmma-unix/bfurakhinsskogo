<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Фонд имени Абдуллахажи Урахинского — Страница не найдена</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' https://cdn.jsdelivr.net https://*.supabase.co 'unsafe-inline'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:;">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: #0a0b0c; color: #e8e8ea; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
      .container { max-width: 480px; text-align: center; }
      h1 { font-size: 32px; font-weight: 700; margin-bottom: 12px; color: #fff; }
      p { font-size: 16px; color: #a8a8b2; margin-bottom: 24px; line-height: 1.5; }
      .btn { display: inline-flex; align-items: center; justify-content: center; background: #40E0D0; color: #0a0b0c; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; transition: opacity 0.2s; }
      .btn:hover { opacity: 0.9; }
      .btn svg { margin-right: 8px; width: 20px; height: 20px; fill: currentColor; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Страница не найдена</h1>
      <p>Запрашиваемый раздел временно недоступен. Вернитесь на главную страницу.</p>
      <a href="/" class="btn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg>На главную</a>
    </div>
    <script>
      // Перенаправление на главную с сохранением якоря, если он был в URL
      const hash = window.location.hash;
      if (hash) {
        window.location.replace('/' + hash);
      }
    </script>
  </body>
</html>
